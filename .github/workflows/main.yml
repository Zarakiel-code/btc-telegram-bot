name: Ejecutar Bot Telegram

on:
  workflow_dispatch: # Te permite iniciarlo a mano cuando quieras
  schedule:
    - cron: '0 */6 * * *' # Se reinicia solo cada 6 horas

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # GitHub da máximo 6 horas por ejecución (casi 6h)

    steps:
      - name: Descargar el código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ejecutar el bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python app.py
        
